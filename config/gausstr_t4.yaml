# GaussTR T4 Configuration (DINOv3CLIP 768-dim + LiDAR depth + SAM3 segmentation, no GT)

defaults:
  - _self_

hydra:
  run:
    dir: work_dirs/${experiment_name}/${run_name}_${now:%Y%m%d_%H%M%S}
  sweep:
    dir: work_dirs/${experiment_name}
    subdir: ${run_name}_${now:%Y%m%d_%H%M%S}
  output_subdir: .hydra

seed: 42
work_dir: work_dirs/${experiment_name}
logger: "mlflow"
experiment_name: "gausstr_t4"
run_name: null
mlflow_tracking_uri: "sqlite:///mlruns/mlflow.db"
mlflow_artifact_location: "mlruns/artifacts"
use_rich_progress: true
early_stopping: false
test_after_training: true

model:
  num_queries: 7200  # 4x increase for better coverage (1800 * 4)
  embed_dims: 256
  feat_dims: 768  # DINOv3CLIP features are 768-dim

  neck_in_channels: 768  # Match DINOv3CLIP feature dim
  neck_out_channels: 256
  neck_norm_type: "LN2d"

  decoder_num_layers: 3
  decoder_embed_dims: 256
  decoder_num_heads: 8
  decoder_ffn_channels: 2048
  decoder_num_levels: 4

  head_reduce_dims: 128
  head_image_shape: [896, 1392]  # H, W to match DINOv3CLIP dino_min=896
  head_render_image_size: [1860, 2880]  # Original image resolution (used with img_aug_mat)
  head_patch_size: 14  # DINOv3 uses 14x14 patches
  head_depth_limit: 101.0  # 16-bit/650 scale max = 65535/650 = 100.82m
  head_text_protos: "ckpts/text_proto_embeds_dinov3clip.pth"  # 768-dim for DINOv3CLIP
  head_text_protos_sam3: "ckpts/text_proto_embeds_dinov3clip_sam3.pth"  # SAM3-aligned for training
  head_prompt_denoising: true
  head_num_segment_classes: 17  # SAM3 has 17 classes (0-16)
  # Original loss weights (hardcoded): loss_depth: 1.0, loss_cosine: 5.0, loss_ce: 1.0
  head_text_loss_weight: 3.0  # Additional text contrastive loss weight
  head_position_loss_weight: 1.0  # Position loss to prevent opacity cheating with RGB+ED
  head_edge_loss_weight: 0.5  # Edge-aware depth loss weight (P0-A improvement)
  head_pca_path: "ckpts/t4_pca_front_wide.pth"  # Pre-computed PCA for single-view stability

  vol_range: [-40, -40, -1, 40, 40, 5.4]
  voxel_size: 0.4
  filter_gaussians: false
  opacity_thresh: 0.0
  sigma_factor: 3.0

  # Optimizer settings
  optimizer: "adamw"  # "adamw" (default), "lion" (faster), or "adam8bit" (memory efficient)
  learning_rate: 0.0001  # Scaled for smaller batch size (was 2e-4 @ bs=4)
  weight_decay: 0.005  # For Lion: use 0.01-0.05 (3-10x higher)
  betas: [0.9, 0.95]  # [0.9, 0.95] recommended for transformers (default [0.9, 0.999])

  # LR schedule settings
  warmup_iters: 100  # Scaled for 8 epochs (was 250 for 24 epochs)
  warmup_factor: 0.001
  lr_schedule: "cosine"  # "cosine" (recommended), "onecycle", or "multistep"
  min_lr_ratio: 0.01  # Final LR = learning_rate * min_lr_ratio
  lr_milestones: [5]  # Only used if lr_schedule="multistep" (scaled for 8 epochs)
  lr_gamma: 0.1
  gradient_clip_val: 35.0

  mean: [123.675, 116.28, 103.53]
  std: [58.395, 57.12, 57.375]

  torch_compile: false
  compile_mode: "reduce-overhead"

data:
  data_root: "/mnt/nvme2/T4_datasets"
  train_ann_file: "/mnt/nvme2/T4_processed/t4_infos_train.pkl"
  val_ann_file: "/mnt/nvme2/T4_processed/t4_infos_val.pkl"
  # T4 images are 2880x1860, target: 1392x896 -> resize factor ~0.4833
  input_size: [896, 1392]  # H, W
  resize_lim: [0.4833, 0.4833]
  fixed_resize_min_side: 896  # Match dinov3clip keep_aspect_min_side_round16
  fixed_resize_round: 16
  # Feature paths
  depth_root: "/mnt/nvme1/data/T4_datasets_priorda_depth"  # Dense depth from Prior-Depth-Anything
  depth_png_format: true  # Depth stored as 16-bit PNG
  depth_scale: 650  # Scale factor: depth_meters = uint16_value / 650
  feats_root: "/mnt/nvme3/T4_datasets_dinov3clip"
  sem_seg_root: "/mnt/nvme3/T4_datasets_sam3"  # SAM3 segmentation masks (PNG)
  batch_size: 2
  num_workers: 6
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  dataset_type: "t4"
  num_views: 1
  use_camera_subdirs: false  # Not using per-camera subdirs directly
  use_chunk_subdirs: true  # Using {chunk_name}/{camera} structure
  sam3_png_format: true  # SAM3 masks are PNG files, not numpy
  has_gt: false
  camera_names:
    - "CAM_FRONT_WIDE"

trainer:
  max_epochs: 8
  accelerator: "gpu"
  devices: 8
  strategy: "ddp_find_unused_parameters_true"  # Required for T4 (some modules conditionally unused)
  precision: "16-mixed"
  gradient_clip_val: 35.0
  gradient_clip_algorithm: "norm"
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  limit_val_batches: 0  # Skip validation (no GT available for T4)
  log_every_n_steps: 50
  deterministic: false
  benchmark: true
  sync_batchnorm: false
  num_sanity_val_steps: 0

visualization:
  enabled: false
  num_samples: -1
  mode: composite
  output_format: image
  fps: 10
  save_predictions: false
